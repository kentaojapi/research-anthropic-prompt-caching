[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bedrock-strands-prompt-cache-prototype"
version = "0.1.0"
description = "Multi-tenant Strands Agents prompt-cache validation prototype"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
    "strands-agents>=1.24.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.setuptools]
py-modules = [
    "agent_factory",
    "cache_config",
    "cache_hooks",
    "test_cache_hit_rate",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
